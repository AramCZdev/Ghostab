name: Build Ghostab

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg \
            dpkg-dev

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Install MinGW cross toolchain
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build Windows executable
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          VERSION="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          mkdir -p dist
          install -Dm755 "target/x86_64-pc-windows-gnu/release/ghostab.exe" \
            "dist/ghostab_${VERSION}_windows-amd64.exe"

      - name: Install Flatpak tools
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak
        run: ./scripts/build-flatpak.sh

      - name: Upload packages as artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ghostab-packages
          path: |
            dist/*.deb
            dist/*.flatpak
            dist/*.exe
          if-no-files-found: error

      - name: Upload packages to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.deb
            dist/*.flatpak
            dist/*.exe
          fail_on_unmatched_files: true
